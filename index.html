<!doctype html>
<!-- The fixed entrance on GitHub Pages: reads url.json (written by scripts/publish-link.mjs whenever the host's
     tunnel gets a new address) and goes there. Copied into the Pages repo as is; see infra/pages/README.md. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van市麻将</title>
<style>
  :root { --paper: #ece3cf; --ink: #221d18; --ink-2: #5b5145; --vermilion: #b23a2a; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { display: flex; align-items: center; justify-content: center; font-family: "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", serif; text-align: center; padding: 0 16px; }
  h1 { font-family: "Ma Shan Zheng", "STXingkai", "Kaiti SC", "KaiTi", serif; font-weight: 400; font-size: 44px; letter-spacing: .12em; margin: 0 0 12px; }
  p { margin: 8px 0; color: var(--ink-2); letter-spacing: .06em; }
  a.go { display: inline-block; margin-top: 14px; padding: 10px 28px; background: var(--vermilion); color: #f6efe0; text-decoration: none; letter-spacing: .2em; font-size: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Van市麻将</h1>
  <p id="say">正在找房间…</p>
  <a class="go" id="go" hidden>进入房间</a>
</main>
<script>
(async () => {
  const say = document.getElementById('say');
  const go = document.getElementById('go');
  // owner.github.io/repo/ → owner/repo
  const owner = location.hostname.split('.')[0];
  const repo = location.pathname.split('/').filter(Boolean)[0] || `${owner}.github.io`;
  const read = async (url, init) => {
    const r = await fetch(url, { cache: 'no-store', ...init });
    if (!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    if (!/^https:\/\//.test(j.url)) throw new Error('bad url');
    return j;
  };
  let link = null;
  // the API sees a push at once; the Pages copy lags a minute behind it (and the API allows 60 reads an hour per IP)
  try { link = await read(`https://api.github.com/repos/${owner}/${repo}/contents/url.json`, { headers: { accept: 'application/vnd.github.raw+json' } }); } catch {}
  if (!link) try { link = await read(`url.json?t=${Date.now()}`); } catch {}
  if (!link) { say.textContent = '房主现在没开房间，晚点再来。'; return; }
  const target = link.url.replace(/\/?$/, '/') + location.search + location.hash;
  go.href = target;
  go.hidden = false;
  say.textContent = '正在进入房间…';
  location.replace(target);
})();
</script>
</body>
</html>
